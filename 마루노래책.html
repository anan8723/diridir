<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마루의 노래책 🎵</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; background: #fdf2f8; min-height: 100vh; color: #2d1b2e; }

/* ── 인라인 메모 박스 ── */
.memo-box { background: #fff8e7; border: 2px dashed #fbbf24; border-radius: 16px; padding: 14px 16px; margin-bottom: 1.5rem; }
.memo-box-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.memo-size-btn { background: none; border: 1px solid #fcd34d; border-radius: 6px; cursor: pointer; color: #b45309; font-size: 13px; padding: 3px 10px; font-family: 'Gowun Dodum', sans-serif; }
.memo-size-btn:hover { background: #fef3c7; }
.memo-clear { background: none; border: none; cursor: pointer; font-size: 14px; color: #fbbf24; padding: 2px 8px; border-radius: 6px; }
.memo-clear:hover { background: #fef3c7; }
.memo-clear.hidden { visibility: hidden; }
.memo-size-row { display: none; align-items: center; gap: 10px; margin-bottom: 8px; }
.memo-size-row.open { display: flex; }
.memo-size-row label { font-size: 12px; color: #b45309; white-space: nowrap; }
.memo-size-row input[type=range] { flex: 1; accent-color: #f59e0b; }
.size-val { font-size: 12px; color: #b45309; min-width: 32px; text-align: right; }
.memo-textarea { width: 100%; border: none; background: transparent; font-family: 'Nanum Pen Script', cursive; font-size: 17px; color: #78350f; outline: none; resize: none; min-height: 36px; max-height: 300px; overflow-y: auto; line-height: 1.6; }
.memo-textarea::placeholder { color: #fcd34d; }
.memo-textarea[readonly] { cursor: default; }
.memo-readonly-hint { font-size: 11px; color: #fcd34d; text-align: right; margin-top: 2px; font-family: 'Gowun Dodum', sans-serif; }

/* ── 앱 본문 ── */
.app { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

/* ── Header ── */
.header { text-align: center; margin-bottom: 1.5rem; position: relative; padding: 0.5rem 0; }
.header h1 { font-family: 'Nanum Pen Script', cursive; font-size: 38px; font-weight: 400; color: #be185d; letter-spacing: 1px; }
.header p  { font-size: 13px; color: #9d174d; margin-top: 2px; }
.gear-btn  { position: absolute; left: 0; top: 8px; background: none; border: 1.5px solid #fbcfe8; border-radius: 10px; cursor: pointer; color: #be185d; font-size: 18px; padding: 5px 9px; line-height: 1; transition: background .15s; }
.gear-btn:hover { background: #fce7f3; }
.gear-btn.on    { background: #fce7f3; border-color: #f9a8d4; }

/* ── Admin banner ── */
.admin-banner { display: none; background: #fce7f3; border: 1.5px solid #f9a8d4; border-radius: 14px; padding: 10px 16px; margin-bottom: 1rem; align-items: center; justify-content: space-between; gap: 8px; }
.admin-banner.on { display: flex; }
.admin-banner span { font-size: 14px; color: #be185d; font-weight: 700; }
.logout-btn { background: white; border: 1px solid #f9a8d4; border-radius: 8px; padding: 5px 14px; font-size: 13px; cursor: pointer; color: #be185d; }
.logout-btn:hover { background: #fdf2f8; }

/* ── Add form ── */
.add-panel { display: none; background: white; border: 1.5px solid #f9a8d4; border-radius: 18px; padding: 18px; margin-bottom: 1rem; }
.add-panel.on { display: block; }
.add-panel-title { font-family: 'Nanum Pen Script', cursive; font-size: 22px; color: #be185d; margin-bottom: 14px; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.form-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
.form-field.wide { flex: 100%; }
.form-field label { font-size: 12px; font-weight: 700; color: #9d174d; }
.form-field input, .form-field select { height: 38px; border-radius: 10px; border: 1px solid #fbcfe8; padding: 0 12px; font-size: 14px; font-family: 'Gowun Dodum', sans-serif; background: #fdf2f8; color: #2d1b2e; outline: none; width: 100%; }
.form-field input:focus, .form-field select:focus { border-color: #ec4899; background: white; }
.hell-check-wrap { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.hell-check-wrap input[type=checkbox] { width: 18px; height: 18px; accent-color: #ef4444; cursor: pointer; }
.hell-check-wrap label { font-size: 13px; color: #9d174d; cursor: pointer; }
.add-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.btn-primary   { background: #ec4899; color: white; border: none; border-radius: 10px; padding: 9px 22px; font-size: 14px; font-family: 'Gowun Dodum', sans-serif; font-weight: 700; cursor: pointer; }
.btn-primary:hover { background: #db2777; }
.btn-secondary { background: white; color: #9d174d; border: 1px solid #fbcfe8; border-radius: 10px; padding: 9px 16px; font-size: 14px; font-family: 'Gowun Dodum', sans-serif; cursor: pointer; }
.btn-secondary:hover { background: #fdf2f8; }

/* ── Search ── */
.search-wrap { position: relative; margin-bottom: 1rem; }
.search-wrap input { width: 100%; height: 44px; border-radius: 14px; border: 1.5px solid #fbcfe8; padding: 0 40px 0 44px; font-size: 15px; font-family: 'Gowun Dodum', sans-serif; background: white; color: #2d1b2e; outline: none; transition: border-color .15s; }
.search-wrap input:focus { border-color: #f472b6; }
.search-ico { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 17px; pointer-events: none; }
.clear-btn  { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #f9a8d4; font-size: 17px; display: none; }
.clear-btn.show { display: block; }

/* ── Tabs ── */
.tabs { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 7px 18px; border-radius: 999px; border: 1.5px solid #fbcfe8; font-size: 13px; font-family: 'Gowun Dodum', sans-serif; cursor: pointer; background: white; color: #9d174d; font-weight: 700; transition: all .15s; }
.tab.active { background: #ec4899; border-color: #ec4899; color: white; }
.tab:hover:not(.active) { background: #fce7f3; }

/* ── Count ── */
.count { font-size: 13px; color: #9d174d; margin-bottom: 10px; opacity: .7; }

/* ── Song list ── */
.song-list { display: flex; flex-direction: column; gap: 8px; }

/* ── Song card — view ── */
.song-card { background: white; border: 1px solid #fce7f3; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; transition: box-shadow .15s; }
.song-card:hover { box-shadow: 0 2px 14px rgba(236,72,153,.1); }
.song-card.hell-card { border-color: #fca5a5; background: #fff8f8; }
.song-info { flex: 1; min-width: 0; }
.artist-name { font-size: 12px; color: #ec4899; font-weight: 700; margin-bottom: 2px; }
.song-title  { font-size: 16px; font-weight: 700; color: #2d1b2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badges { display: flex; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.genre-badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
.badge-kpop { background: #fce7f3; color: #be185d; }
.badge-pop  { background: #ede9fe; color: #6d28d9; }
.badge-jpop { background: #ecfdf5; color: #065f46; }
.badge-hell { background: #fee2e2; color: #b91c1c; font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
.song-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.mr-link    { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #ec4899; border: 1.5px solid #fbcfe8; border-radius: 8px; padding: 5px 11px; text-decoration: none; background: white; white-space: nowrap; font-family: 'Gowun Dodum', sans-serif; }
.mr-link:hover { background: #fce7f3; }
.no-link-txt { font-size: 12px; color: #d1d5db; }
.card-admin-btns { display: flex; gap: 6px; }
.btn-edit-sm { background: none; border: 1px solid #fbcfe8; border-radius: 8px; padding: 5px 10px; font-size: 12px; color: #9d174d; cursor: pointer; white-space: nowrap; }
.btn-edit-sm:hover { background: #fce7f3; }
.btn-del-sm  { background: none; border: 1px solid #fca5a5; border-radius: 8px; padding: 5px 10px; font-size: 12px; color: #e11d48; cursor: pointer; white-space: nowrap; }
.btn-del-sm:hover { background: #fff1f2; }

/* ── Edit mode ── */
.song-card.edit-mode { flex-direction: column; align-items: stretch; background: #fffbff; border: 1.5px solid #f9a8d4; }
.edit-row   { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.edit-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
.edit-field.wide { flex: 100%; }
.edit-field label { font-size: 11px; font-weight: 700; color: #9d174d; }
.edit-field input, .edit-field select { height: 36px; border-radius: 8px; border: 1px solid #fbcfe8; padding: 0 10px; font-size: 13px; font-family: 'Gowun Dodum', sans-serif; background: white; color: #2d1b2e; outline: none; width: 100%; }
.edit-field input:focus, .edit-field select:focus { border-color: #ec4899; }
.edit-hell-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.edit-hell-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #ef4444; cursor: pointer; }
.edit-hell-row label { font-size: 13px; color: #b91c1c; cursor: pointer; }
.edit-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.edit-right { display: flex; gap: 8px; }
.btn-save-sm   { background: #ec4899; color: white; border: none; border-radius: 8px; padding: 7px 18px; font-size: 13px; font-family: 'Gowun Dodum', sans-serif; font-weight: 700; cursor: pointer; }
.btn-save-sm:hover { background: #db2777; }
.btn-cancel-sm { background: white; color: #9d174d; border: 1px solid #fbcfe8; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-family: 'Gowun Dodum', sans-serif; cursor: pointer; }
.btn-cancel-sm:hover { background: #fdf2f8; }
.btn-destroy   { background: white; color: #e11d48; border: 1px solid #fca5a5; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-family: 'Gowun Dodum', sans-serif; cursor: pointer; }
.btn-destroy:hover { background: #fff1f2; }

/* ── Empty ── */
.empty { text-align: center; padding: 3rem 1rem; }
.empty .emoji { font-size: 36px; }
.empty p { font-family: 'Nanum Pen Script', cursive; font-size: 22px; margin-top: 8px; color: #f9a8d4; }

/* ── Modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); align-items: center; justify-content: center; z-index: 300; }
.modal-overlay.open { display: flex; }
.modal { background: white; border-radius: 22px; border: 1px solid #fce7f3; padding: 2rem; width: 300px; }
.modal h2 { font-family: 'Nanum Pen Script', cursive; font-size: 26px; font-weight: 400; margin-bottom: 1rem; color: #be185d; }
.modal input { width: 100%; height: 42px; border-radius: 10px; border: 1.5px solid #fbcfe8; padding: 0 14px; font-size: 14px; font-family: 'Gowun Dodum', sans-serif; color: #2d1b2e; outline: none; }
.modal input:focus { border-color: #ec4899; }
.modal-err  { font-size: 12px; color: #e11d48; margin-top: 6px; min-height: 18px; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
.btn-modal-cancel { background: white; border: 1px solid #fbcfe8; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-family: 'Gowun Dodum', sans-serif; cursor: pointer; color: #9d174d; }
.btn-modal-ok { background: #ec4899; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-family: 'Gowun Dodum', sans-serif; font-weight: 700; cursor: pointer; color: white; }
.btn-modal-ok:hover { background: #db2777; }

/* ── Toast ── */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #2d1b2e; color: white; border-radius: 12px; padding: 11px 22px; font-size: 14px; font-family: 'Gowun Dodum', sans-serif; font-weight: 700; z-index: 400; transition: transform .25s; pointer-events: none; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

<div class="app">

  <!-- Header -->
  <div class="header">
    <button class="gear-btn" id="gearBtn" title="관리자 로그인">⚙️</button>
    <h1>마루의 노래책 🎵</h1>
    <p>K-pop · Pop · J-pop 즐겨찾기</p>
  </div>

  <!-- 메모 박스 -->
  <div class="memo-box" id="memoBox">
    <div class="memo-box-toolbar">
      <button class="memo-size-btn" id="memSizeToggle">가 크기</button>
      <button class="memo-clear hidden" id="memoClear">✕ 지우기</button>
    </div>
    <div class="memo-size-row" id="sizePanel">
      <label>글씨 크기</label>
      <input type="range" id="memoSizeRange" min="13" max="30" value="17" step="1" />
      <span class="size-val" id="sizeVal">17px</span>
    </div>
    <textarea class="memo-textarea" id="memoInput" placeholder="여기에 메모를 적어요 🌸&#10;예) 노래 120곡 · 헬곡 5곡" readonly rows="2"></textarea>
    <div class="memo-readonly-hint" id="memoHint">🔒 관리자만 편집할 수 있어요</div>
  </div>

  <!-- Admin banner -->
  <div class="admin-banner" id="adminBanner">
    <span>🔓 관리자 모드 — 자유롭게 수정하세요!</span>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </div>

  <!-- Add panel -->
  <div class="add-panel" id="addPanel">
    <div class="add-panel-title">➕ 새 노래 추가하기</div>
    <div class="form-row">
      <div class="form-field"><label>가수명</label><input type="text" id="nArtist" placeholder="예) 아이유" /></div>
      <div class="form-field"><label>제목</label><input type="text" id="nTitle" placeholder="예) 좋은 날" /></div>
    </div>
    <div class="form-row">
      <div class="form-field" style="max-width:140px"><label>장르</label>
        <select id="nGenre">
          <option value="kpop">K-pop</option>
          <option value="pop">Pop</option>
          <option value="jpop">J-pop</option>
        </select>
      </div>
      <div class="form-field wide"><label>MR 링크 (유튜브)</label><input type="text" id="nUrl" placeholder="https://www.youtube.com/watch?v=..." /></div>
    </div>
    <div class="hell-check-wrap">
      <input type="checkbox" id="nHell" />
      <label for="nHell">🔥 헬곡으로 표시</label>
    </div>
    <div class="add-btns">
      <button class="btn-secondary" id="clearFormBtn">초기화</button>
      <button class="btn-primary" id="addOkBtn">추가하기</button>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input type="text" id="searchInput" placeholder="가수 또는 제목 검색..." />
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-genre="all">전체</button>
    <button class="tab" data-genre="kpop">K-pop</button>
    <button class="tab" data-genre="pop">Pop</button>
    <button class="tab" data-genre="jpop">J-pop</button>
    <button class="tab" data-genre="hell">🔥 헬곡</button>
  </div>

  <div class="count" id="count"></div>
  <div class="song-list" id="songList"></div>
</div>

<!-- Login modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>🔐 관리자 로그인</h2>
    <input type="password" id="pwInput" placeholder="비밀번호 입력" />
    <div class="modal-err" id="modalErr"></div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" id="modalCancelBtn">취소</button>
      <button class="btn-modal-ok" id="modalOkBtn">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ── State ── */
let songs    = JSON.parse(localStorage.getItem('maru_songs') || 'null') || DEFAULT_SONGS.map(s=>({...s}));
let nextId   = Math.max(...songs.map(s=>s.id), 0) + 1;
let isAdmin  = false;
let curGenre = 'all';
let searchQ  = '';
let editingId = null;

function save() { localStorage.setItem('maru_songs', JSON.stringify(songs)); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── 메모 (관리자만 편집) ── */
const memoKey  = 'maru_memo';
const memoSize = 'maru_memo_size';
const memoEl   = document.getElementById('memoInput');
const memoClrBtn = document.getElementById('memoClear');
const sizeRange  = document.getElementById('memoSizeRange');
const sizeVal    = document.getElementById('sizeVal');


function loadMemo() {
  const txt  = localStorage.getItem(memoKey) || '';
  const size = parseInt(localStorage.getItem(memoSize) || '17');
  memoEl.value = txt;
  sizeRange.value = size;
  sizeVal.textContent = size + 'px';
  memoEl.style.fontSize = size + 'px';
  // 높이 자동 조절
  memoEl.style.height = 'auto';
  memoEl.style.height = Math.min(memoEl.scrollHeight, 200) + 'px';
}
function setMemoEditable(editable) {
  memoEl.readOnly = !editable;
  memoClrBtn.classList.toggle('hidden', !editable);
  const hint = document.getElementById('memoHint');
  if (hint) hint.style.display = editable ? 'none' : 'block';
  if (editable) memoEl.placeholder = '여기에 메모를 적어요 🌸\n예) 노래 120곡 · 헬곡 5곡';
}
memoEl.addEventListener('input', () => {
  localStorage.setItem(memoKey, memoEl.value);
  memoEl.style.height = 'auto';
  memoEl.style.height = Math.min(memoEl.scrollHeight, 200) + 'px';
});
memoClrBtn.addEventListener('click', () => {
  memoEl.value = '';
  memoEl.style.height = 'auto';
  localStorage.removeItem(memoKey);
  memoEl.focus();
});
document.getElementById('memSizeToggle').addEventListener('click', () => {
  document.getElementById('sizePanel').classList.toggle('open');
});
sizeRange.addEventListener('input', () => {
  const v = sizeRange.value;
  sizeVal.textContent = v + 'px';
  memoEl.style.fontSize = v + 'px';
  localStorage.setItem(memoSize, v);
  memoEl.style.height = 'auto';
  memoEl.style.height = Math.min(memoEl.scrollHeight, 200) + 'px';
});

loadMemo();
setMemoEditable(false);

/* ── Filter ── */
function filtered() {
  const q = searchQ.toLowerCase();
  return songs.filter(s => {
    let gm;
    if (curGenre === 'all') gm = true;
    else if (curGenre === 'hell') gm = !!s.hell;
    else gm = s.genre === curGenre;
    const tm = !q || s.artist.toLowerCase().includes(q) || s.title.toLowerCase().includes(q);
    return gm && tm;
  });
}

/* ── Render ── */
function render() {
  const list = filtered();
  document.getElementById('count').textContent = `총 ${list.length}곡`;
  const el = document.getElementById('songList');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="emoji">🎵</div><p>검색 결과가 없어요~</p></div>';
    return;
  }
  el.innerHTML = list.map(s => {
    if (isAdmin && editingId === s.id) {
      return `<div class="song-card edit-mode" data-id="${s.id}">
        <div class="edit-row">
          <div class="edit-field"><label>가수명</label><input id="ea${s.id}" value="${esc(s.artist)}" /></div>
          <div class="edit-field"><label>제목</label><input id="et${s.id}" value="${esc(s.title)}" /></div>
        </div>
        <div class="edit-row">
          <div class="edit-field" style="max-width:140px"><label>장르</label>
            <select id="eg${s.id}">
              <option value="kpop"${s.genre==='kpop'?' selected':''}>K-pop</option>
              <option value="pop"${s.genre==='pop'?' selected':''}>Pop</option>
              <option value="jpop"${s.genre==='jpop'?' selected':''}>J-pop</option>
            </select>
          </div>
          <div class="edit-field wide"><label>MR 링크</label><input id="eu${s.id}" value="${esc(s.url)}" placeholder="https://..." /></div>
        </div>
        <div class="edit-hell-row">
          <input type="checkbox" id="eh${s.id}" ${s.hell?'checked':''} />
          <label for="eh${s.id}">🔥 헬곡으로 표시</label>
        </div>
        <div class="edit-actions">
          <button class="btn-destroy" onclick="deleteSong(${s.id})">🗑️ 삭제</button>
          <div class="edit-right">
            <button class="btn-cancel-sm" onclick="cancelEdit()">취소</button>
            <button class="btn-save-sm" onclick="saveEdit(${s.id})">저장</button>
          </div>
        </div>
      </div>`;
    }
    const genreBadge = s.genre==='kpop' ? '<span class="genre-badge badge-kpop">K-pop</span>'
      : s.genre==='jpop' ? '<span class="genre-badge badge-jpop">J-pop</span>'
      : '<span class="genre-badge badge-pop">Pop</span>';
    const hellBadge = s.hell ? '<span class="badge-hell">🔥 헬곡</span>' : '';
    const link = s.url
      ? `<a class="mr-link" href="${esc(s.url)}" target="_blank">🎵 MR링크</a>`
      : `<span class="no-link-txt">링크 없음</span>`;
    const adminBtns = isAdmin ? `<div class="card-admin-btns">
      <button class="btn-edit-sm" onclick="startEdit(${s.id})">✏️ 수정</button>
      <button class="btn-del-sm" onclick="deleteSong(${s.id})">🗑️ 삭제</button>
    </div>` : '';
    return `<div class="song-card${s.hell?' hell-card':''}" data-id="${s.id}">
      <div class="song-info">
        <div class="artist-name">${esc(s.artist)}</div>
        <div class="song-title">${esc(s.title)}</div>
        <div class="badges">${genreBadge}${hellBadge}</div>
      </div>
      <div class="song-right">${link}${adminBtns}</div>
    </div>`;
  }).join('');
}

/* ── Edit helpers ── */
function startEdit(id) { editingId=id; render(); document.querySelector(`.song-card[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}); }
function cancelEdit() { editingId=null; render(); }
function saveEdit(id) {
  const idx = songs.findIndex(s=>s.id===id);
  if (idx<0) return;
  const artist = document.getElementById('ea'+id).value.trim();
  const title  = document.getElementById('et'+id).value.trim();
  if (!artist||!title) { toast('가수명과 제목은 필수예요!'); return; }
  songs[idx] = {...songs[idx], artist, title, genre:document.getElementById('eg'+id).value, url:document.getElementById('eu'+id).value.trim(), hell:document.getElementById('eh'+id).checked};
  save(); editingId=null; render(); toast('저장했어요 ✓');
}
function deleteSong(id) {
  if (!confirm('이 곡을 삭제할까요?')) return;
  songs = songs.filter(s=>s.id!==id);
  save(); if (editingId===id) editingId=null; render(); toast('삭제했어요');
}

/* ── Tabs ── */
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  curGenre = t.dataset.genre;
  editingId = null;
  render();
});

/* ── Search ── */
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value;
  document.getElementById('clearBtn').classList.toggle('show', !!searchQ);
  render();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  searchQ = '';
  document.getElementById('clearBtn').classList.remove('show');
  render();
});

/* ── Add song ── */
function clearAddForm() {
  ['nArtist','nTitle','nUrl'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('nGenre').value='kpop';
  document.getElementById('nHell').checked=false;
}
document.getElementById('clearFormBtn').addEventListener('click', clearAddForm);
document.getElementById('addOkBtn').addEventListener('click', () => {
  const artist = document.getElementById('nArtist').value.trim();
  const title  = document.getElementById('nTitle').value.trim();
  if (!artist||!title) { toast('가수명과 제목을 입력해주세요!'); return; }
  songs.push({id:nextId++, artist, title, genre:document.getElementById('nGenre').value, url:document.getElementById('nUrl').value.trim(), hell:document.getElementById('nHell').checked});
  save(); clearAddForm(); render(); toast('추가했어요 ✓');
  document.getElementById('nArtist').focus();
});
['nArtist','nTitle','nUrl'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('addOkBtn').click(); });
});

/* ── Admin login ── */
document.getElementById('gearBtn').addEventListener('click', () => {
  if (isAdmin) return;
  document.getElementById('pwInput').value='';
  document.getElementById('modalErr').textContent='';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('pwInput').focus(), 60);
});
document.getElementById('modalCancelBtn').addEventListener('click', ()=>document.getElementById('modalOverlay').classList.remove('open'));
document.getElementById('modalOkBtn').addEventListener('click', () => {
  const pw = document.getElementById('pwInput').value;
  if (!pw) { document.getElementById('modalErr').textContent='비밀번호를 입력해주세요.'; return; }
  if (pw===ADMIN_PW) {
    isAdmin=true;
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('adminBanner').classList.add('on');
    document.getElementById('addPanel').classList.add('on');
    document.getElementById('gearBtn').classList.add('on');
    setMemoEditable(true);
    render(); toast('관리자 모드 ✓');
  } else {
    document.getElementById('modalErr').textContent='비밀번호가 틀렸어요.';
    document.getElementById('pwInput').select();
  }
});
document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('modalOkBtn').click(); });

/* ── Logout ── */
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  isAdmin=false; editingId=null;
  ['adminBanner','addPanel'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById('gearBtn').classList.remove('on');
  setMemoEditable(false);
  document.getElementById('sizePanel').classList.remove('open');
  render(); toast('로그아웃 됐어요');
});

render();
</script>
