<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마루의 노래책 🎵</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #fdf2f8; min-height: 100vh; color: #1a1a2e; }

.app { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

/* Header */
.header { text-align: center; margin-bottom: 1.5rem; position: relative; padding: 0.5rem 0; }
.header h1 { font-size: 26px; font-weight: 700; color: #be185d; letter-spacing: -0.5px; }
.header p { font-size: 13px; color: #9d174d; margin-top: 4px; }
.gear-btn { position: absolute; left: 0; top: 6px; background: none; border: 1px solid #fbcfe8; border-radius: 8px; cursor: pointer; color: #be185d; font-size: 18px; padding: 6px 8px; line-height: 1; transition: background 0.15s; }
.gear-btn:hover { background: #fce7f3; }
.gear-btn.active { background: #fce7f3; }

/* Admin bar */
.admin-bar { display: none; background: #fce7f3; border: 1px solid #f9a8d4; border-radius: 12px; padding: 10px 16px; margin-bottom: 1rem; align-items: center; justify-content: space-between; }
.admin-bar.on { display: flex; }
.admin-bar span { font-size: 13px; color: #be185d; font-weight: 600; }
.logout-btn { background: white; border: 1px solid #f9a8d4; border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: #be185d; transition: background 0.15s; }
.logout-btn:hover { background: #fce7f3; }

/* Search */
.search-wrap { position: relative; margin-bottom: 1rem; }
.search-wrap input { width: 100%; height: 42px; border-radius: 12px; border: 1.5px solid #fbcfe8; padding: 0 16px 0 42px; font-size: 14px; background: white; color: #1a1a2e; outline: none; transition: border-color 0.15s; }
.search-wrap input:focus { border-color: #f472b6; }
.search-wrap .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #f9a8d4; font-size: 17px; pointer-events: none; }
.clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #f9a8d4; font-size: 16px; display: none; }
.clear-btn.show { display: block; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 7px 18px; border-radius: 999px; border: 1.5px solid #fbcfe8; font-size: 13px; cursor: pointer; background: white; color: #9d174d; font-weight: 500; transition: all 0.15s; }
.tab.active { background: #ec4899; border-color: #ec4899; color: white; }
.tab:hover:not(.active) { background: #fce7f3; }

/* Count */
.count { font-size: 13px; color: #9d174d; margin-bottom: 10px; opacity: 0.7; }

/* Song list */
.song-list { display: flex; flex-direction: column; gap: 8px; }

/* Song card - VIEW mode */
.song-card { background: white; border: 1px solid #fce7f3; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; transition: box-shadow 0.15s; }
.song-card:hover { box-shadow: 0 2px 12px rgba(236,72,153,0.1); }
.song-info { flex: 1; min-width: 0; }
.artist-name { font-size: 12px; color: #ec4899; font-weight: 600; margin-bottom: 3px; }
.song-title { font-size: 15px; font-weight: 600; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.genre-badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; margin-top: 5px; font-weight: 500; }
.badge-kpop { background: #fce7f3; color: #be185d; }
.badge-pop { background: #ede9fe; color: #6d28d9; }
.song-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.mr-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #ec4899; border: 1.5px solid #fbcfe8; border-radius: 8px; padding: 5px 11px; text-decoration: none; background: white; white-space: nowrap; transition: background 0.15s; }
.mr-link:hover { background: #fce7f3; }
.no-link-txt { font-size: 12px; color: #d1d5db; }

/* Song card - EDIT mode */
.song-card.edit-mode { flex-direction: column; align-items: stretch; background: #fffbff; border: 1.5px solid #f9a8d4; }
.edit-row { display: flex; gap: 8px; flex-wrap: wrap; }
.edit-field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 120px; }
.edit-field label { font-size: 11px; color: #9d174d; font-weight: 600; }
.edit-field input, .edit-field select { height: 34px; border-radius: 8px; border: 1px solid #fbcfe8; padding: 0 10px; font-size: 13px; background: white; color: #1a1a2e; outline: none; width: 100%; }
.edit-field input:focus, .edit-field select:focus { border-color: #ec4899; }
.edit-field.url-field { flex: 100%; }
.edit-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.btn-save { background: #ec4899; color: white; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-save:hover { background: #db2777; }
.btn-delete { background: white; color: #e11d48; border: 1px solid #fca5a5; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.btn-delete:hover { background: #fff1f2; }
.btn-edit-card { background: none; border: 1px solid #fbcfe8; border-radius: 8px; padding: 5px 10px; font-size: 12px; color: #9d174d; cursor: pointer; white-space: nowrap; }
.btn-edit-card:hover { background: #fce7f3; }

/* Add song */
.add-song-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: white; border: 2px dashed #f9a8d4; border-radius: 14px; color: #ec4899; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
.add-song-btn:hover { background: #fdf2f8; }
.add-form { background: #fffbff; border: 1.5px solid #f9a8d4; border-radius: 14px; padding: 16px; margin-top: 8px; display: none; }
.add-form.open { display: block; }
.add-form h3 { font-size: 14px; font-weight: 700; color: #be185d; margin-bottom: 12px; }
.add-form .edit-row { margin-bottom: 8px; }
.add-form .form-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.btn-add-ok { background: #ec4899; color: white; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-add-cancel { background: white; border: 1px solid #fbcfe8; border-radius: 8px; padding: 8px 14px; font-size: 13px; color: #9d174d; cursor: pointer; }

/* Empty */
.empty { text-align: center; padding: 3rem 1rem; color: #f9a8d4; }
.empty p { font-size: 14px; margin-top: 8px; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.open { display: flex; }
.modal { background: white; border-radius: 18px; border: 1px solid #fce7f3; padding: 1.75rem; width: 300px; }
.modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 1rem; color: #be185d; }
.modal input { width: 100%; height: 40px; border-radius: 10px; border: 1.5px solid #fbcfe8; padding: 0 14px; font-size: 14px; color: #1a1a2e; outline: none; }
.modal input:focus { border-color: #ec4899; }
.modal-err { font-size: 12px; color: #e11d48; margin-top: 6px; min-height: 18px; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
.btn-modal-cancel { background: white; border: 1px solid #fbcfe8; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: #9d174d; }
.btn-modal-ok { background: #ec4899; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; color: white; }
.btn-modal-ok:hover { background: #db2777; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a2e; color: white; border-radius: 10px; padding: 10px 20px; font-size: 13px; z-index: 200; transition: transform 0.25s; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

<div class="app">
  <div class="header">
    <button class="gear-btn" id="gearBtn" title="관리자 로그인">⚙️</button>
    <h1>마루의 노래책 🎵</h1>

  </div>

  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="가수 또는 제목 검색..." />
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-genre="all">전체</button>
    <button class="tab" data-genre="kpop">K-pop</button>
    <button class="tab" data-genre="pop">Pop</button>
  </div>

  <div class="count" id="syncStatus">⚪ 서버 연결 준비 중</div>
  <div class="count" id="count"></div>
  <div class="song-list" id="songList"></div>
  <button class="add-song-btn" id="addSongBtn" style="display:none">＋ 노래 추가</button>
  <button class="add-song-btn" id="importBtn" style="display:none">📤 최초 기본 노래 220곡 등록</button>
  <div class="add-form" id="addForm">
    <h3>새 노래 추가</h3>
    <div class="edit-row">
      <div class="edit-field"><label>가수명</label><input type="text" id="newArtist" placeholder="가수 이름" /></div>

    </div>
    <div class="edit-row">
      <div class="edit-field"><label>장르</label>
        <select id="newGenre">
          <option value="kpop">K-pop</option>
          <option value="pop">Pop</option>
        </select>
      </div>
    </div>
    <div class="edit-row">
      <div class="edit-field url-field"><label>유튜브 링크 (MR)</label><input type="text" id="newUrl" placeholder="https://www.youtube.com/..." /></div>
    </div>
    <div class="form-btns">
      <button class="btn-add-cancel" id="addCancelBtn">취소</button>
      <button class="btn-add-ok" id="addOkBtn">추가하기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>🔐 관리자 로그인</h2>
    <input type="password" id="pwInput" placeholder="비밀번호 입력" />
    <div class="modal-err" id="modalErr"></div>
    <div class="modal-btns">

</div>

<div class="toast" id="toast"></div>

];

let songs = DEFAULT_SONGS.map(s => ({...s}));
let nextId = Math.max(...songs.map(s => s.id)) + 1;
let isAdmin = false;
let currentGenre = 'all';
let searchQ = '';
let editingId = null;

function saveSongs() { /* 서버 저장은 sendOperation()에서 수행 */ }

function jsonpRead() {
  return new Promise((resolve, reject) => {
    const cb = 'maru_cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timeout = setTimeout(() => finish(new Error('연결 시간 초과')), 12000);
    function finish(err, data) {
      clearTimeout(timeout); delete window[cb]; script.remove();
      err ? reject(err) : resolve(data);
    }
    window[cb] = data => finish(null, data);
    script.onerror = () => finish(new Error('서버 연결 실패'));
    script.src = SCRIPT_URL + '?callback=' + cb + '&t=' + Date.now();
    document.head.appendChild(script);
  });
}
async function refreshSongs(silent = true) {
  if (!CONFIGURED || loadingRemote) return;
  loadingRemote = true;
  try {
    const data = await jsonpRead();
    if (!data.ok) throw new Error(data.error || '불러오기 실패');
    remoteReady = true;
    lastOps = data.ops || [];
    if (data.version !== latestVersion) {
      latestVersion = data.version;
      songs = Array.isArray(data.songs) && data.songs.length ? data.songs : [];
      nextId = Math.max(0, ...songs.map(s => Number(s.id) || 0)) + 1;
      if (editingId === null) render();
    }
    document.getElementById('syncStatus').textContent = '🟢 공용 노래책 연결됨 · 약 8초마다 자동 갱신';
  } catch (err) {
    document.getElementById('syncStatus').textContent = '🔴 공용 데이터 연결 실패 · 설정을 확인하세요';
    if (!silent) showToast(err.message);
  } finally { loadingRemote = false; }
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
async function sendOperation(action, payload) {
  if (!CONFIGURED || !remoteReady) { showToast('먼저 공용 서버 연결을 확인해주세요'); return false; }
  if (!adminPassword) { showToast('관리자 로그인이 필요합니다'); return false; }
  const opId = Date.now() + '_' + Math.random().toString(36).slice(2);
  try {
    // 단순 요청으로 보내 Apps Script의 CORS preflight 문제를 피합니다.
    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload, password: adminPassword, opId }) });
    for (let i = 0; i < 7; i++) {
      await wait(1500);
      await refreshSongs();
      if (lastOps.includes(opId)) return true;
    }
    showToast('서버 저장 확인 실패 · 비밀번호/배포 권한을 확인하세요');
    return false;
  } catch (e) { showToast('저장 요청 실패: ' + e.message); return false; }
}


function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function getFiltered() {
  return songs.filter(s => {
    const gm = currentGenre === 'all' || s.genre === currentGenre;
    const q = searchQ.toLowerCase();
    const tm = !q || s.artist.toLowerCase().includes(q) || s.title.toLowerCase().includes(q);
    return gm && tm;
  });
}

function render() {
  const list = getFiltered();
  document.getElementById('count').textContent = `총 ${list.length}곡`;
  const el = document.getElementById('songList');
  document.getElementById('addSongBtn').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('importBtn').style.display = isAdmin && remoteReady && songs.length === 0 ? 'flex' : 'none';

  if (list.length === 0) {
    el.innerHTML = '<div class="empty"><div style="font-size:36px">🎵</div><p>검색 결과가 없어요</p></div>';
    return;
  }

  el.innerHTML = list.map(s => {
    if (isAdmin && editingId === s.id) {
      return `
        <div class="song-card edit-mode" data-id="${s.id}">
          <div class="edit-row">
            <div class="edit-field"><label>가수명</label><input type="text" id="ea_${s.id}" value="${esc(s.artist)}" /></div>
            <div class="edit-field"><label>제목</label><input type="text" id="et_${s.id}" value="${esc(s.title)}" /></div>
          </div>
          <div class="edit-row">
            <div class="edit-field"><label>장르</label>
              <select id="eg_${s.id}">
                <option value="kpop" ${s.genre==='kpop'?'selected':''}>K-pop</option>
                <option value="pop" ${s.genre==='pop'?'selected':''}>Pop</option>
              </select>
            </div>
          </div>
          <div class="edit-row">
            <div class="edit-field url-field"><label>MR 링크</label><input type="text" id="eu_${s.id}" value="${esc(s.url)}" placeholder="https://www.youtube.com/..." /></div>
          </div>
          <div class="edit-btns">
            <button class="btn-delete" onclick="deleteSong(${s.id})">삭제</button>
            <button class="btn-modal-cancel" onclick="cancelEdit()" style="font-size:13px;padding:7px 12px">취소</button>
            <button class="btn-save" onclick="saveEdit(${s.id})">저장</button>
          </div>
        </div>`;
    }
    const badgeClass = s.genre === 'kpop' ? 'badge-kpop' : 'badge-pop';
    const badgeLabel = s.genre === 'kpop' ? 'K-pop' : 'Pop';
    const linkBtn = s.url
      ? `<a class="mr-link" href="${esc(s.url)}" target="_blank">🎵 MR링크</a>`
      : `<span class="no-link-txt">링크 없음</span>`;
    const editBtn = isAdmin ? `<button class="btn-edit-card" onclick="startEdit(${s.id})">✏️ 수정</button>` : '';
    return `
      <div class="song-card" data-id="${s.id}">
        <div class="song-info">
          <div class="artist-name">${esc(s.artist)}</div>
          <div class="song-title">${esc(s.title)}</div>
          <span class="genre-badge ${badgeClass}">${badgeLabel}</span>
        </div>
        <div class="song-actions">
          ${linkBtn}
          ${editBtn}
        </div>
      </div>`;
  }).join('');

}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startEdit(id) {
  editingId = id;
  render();
  const el = document.querySelector(`.song-card[data-id="${id}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelEdit() { editingId = null; render(); }

async function saveEdit(id) {
  const artist = document.getElementById('ea_' + id).value.trim();
  const title = document.getElementById('et_' + id).value.trim();
  const genre = document.getElementById('eg_' + id).value;
  const url = document.getElementById('eu_' + id).value.trim();
  if (!artist || !title) { showToast('가수명과 제목을 입력해주세요'); return; }
  if (await sendOperation('update', {id, artist, title, genre, url})) {
    editingId = null; await refreshSongs(); render(); showToast('공용 노래책에 저장했어요 ✓');
  }
}
async function deleteSong(id) {
  if (!confirm('이 곡을 모든 시청자 노래책에서 삭제할까요?')) return;
  if (await sendOperation('delete', {id})) {
    editingId = null; await refreshSongs(); render(); showToast('공용 노래책에서 삭제했어요 ✓');
  }
}

// Tabs
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentGenre = t.dataset.genre;
  editingId = null;
  render();
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value;
  document.getElementById('clearBtn').classList.toggle('show', !!searchQ);
  render();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  searchQ = '';
  document.getElementById('clearBtn').classList.remove('show');
  render();
});

// Admin login
document.getElementById('gearBtn').addEventListener('click', () => {
  if (isAdmin) return;
  document.getElementById('pwInput').value = '';
  document.getElementById('modalErr').textContent = '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('pwInput').focus(), 80);
});
document.getElementById('modalCancelBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('open');
});
document.getElementById('modalOkBtn').addEventListener('click', async () => {
  const pw = document.getElementById('pwInput').value;
  if (!pw) { document.getElementById('modalErr').textContent = '비밀번호를 입력해주세요.'; return; }
  if (!CONFIGURED) { document.getElementById('modalErr').textContent = '먼저 Apps Script 주소를 설정해주세요.'; return; }
  // 비밀번호는 서버에서만 검증하며 HTML에는 저장하지 않습니다.
  adminPassword = pw;
  document.getElementById('pwInput').value = '';
  isAdmin = true;
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('adminBar').classList.add('on');
  document.getElementById('gearBtn').classList.add('active');
  render(); showToast('관리자 모드 · 저장 시 서버에서 비밀번호 확인');
});
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('modalOkBtn').click();
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', () => {
  isAdmin = false;
  adminPassword = '';
  editingId = null;
  document.getElementById('adminBar').classList.remove('on');
  document.getElementById('gearBtn').classList.remove('active');
  document.getElementById('addForm').classList.remove('open');
  render();
  showToast('로그아웃 되었어요');
});

// Add song
document.getElementById('addSongBtn').addEventListener('click', () => {
  document.getElementById('addForm').classList.toggle('open');
  if (document.getElementById('addForm').classList.contains('open')) {
    document.getElementById('newArtist').value = '';
    document.getElementById('newTitle').value = '';
    document.getElementById('newUrl').value = '';
    document.getElementById('newGenre').value = 'kpop';
    document.getElementById('newArtist').focus();
  }
});
document.getElementById('addCancelBtn').addEventListener('click', () => {
  document.getElementById('addForm').classList.remove('open');
});
document.getElementById('addOkBtn').addEventListener('click', async () => {
  const artist = document.getElementById('newArtist').value.trim();
  const title = document.getElementById('newTitle').value.trim();
  const genre = document.getElementById('newGenre').value;
  const url = document.getElementById('newUrl').value.trim();
  if (!artist || !title) { showToast('가수명과 제목을 입력해주세요'); return; }
  if (await sendOperation('add', {artist, title, genre, url})) {
    document.getElementById('addForm').classList.remove('open');
    await refreshSongs(); render(); showToast('모든 시청자 노래책에 추가했어요 ✓');
  }
});
document.getElementById('importBtn').addEventListener('click', async () => {
  if (songs.length !== 0) { showToast('이미 노래가 등록되어 있습니다'); return; }
  if (!confirm('기본 노래 220곡을 공용 구글시트에 최초 등록할까요?')) return;
  if (await sendOperation('import', {songs: DEFAULT_SONGS})) {
    await refreshSongs(); render(); showToast('기본 노래 등록 완료 ✓');
  }
});
if (!CONFIGURED) {
  document.getElementById('syncStatus').textContent = '🟠 Apps Script 배포 URL을 HTML에 입력해야 합니다';
  songs = DEFAULT_SONGS.map(s => ({...s}));
} else {
  songs = [];
  refreshSongs(false);
  setInterval(() => refreshSongs(), POLL_MS);
}
render();
</script>
