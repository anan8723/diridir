<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사다리타기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: #F3F1FF;
    font-family: 'Gaegu', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-weight: 700;
    color: #2B2A3D;
  }
  .page { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 42px; font-weight: 700; margin: 0 0 4px; color: #2B2A3D; }
  .madeby { position: fixed; right: 14px; bottom: 10px; font-size: 13px; color: #B4B1CC; font-weight: 700; z-index: 50; }
  header p { margin: 0; color: #57546E; font-size: 17px; font-weight: 700; }
  .game-row { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .game-row > .card { flex: 1 1 auto; min-width: 0; }
  .side-col { width: 240px; flex: 0 0 240px; display: flex; flex-direction: column; gap: 12px; }
  .vol-bar {
    display: flex; align-items: center; gap: 8px;
    background: #FFFFFF; border: 2.5px solid #2B2A3D; border-radius: 16px;
    box-shadow: 3px 3px 0 #D8D3FF; padding: 8px 12px;
  }
  .vol-bar input[type=range] { flex: 1; }
  .card {
    background: #FFFFFF;
    border: 3px solid #2B2A3D;
    border-radius: 24px;
    box-shadow: 6px 6px 0 #D8D3FF;
    padding: 20px;
    margin-bottom: 20px;
  }
  .side-card {
    width: 100%;
    background: #FFFFFF;
    border: 3px solid #2B2A3D;
    border-radius: 24px;
    box-shadow: 6px 6px 0 #D8D3FF;
    padding: 18px;
    max-height: 460px;
    overflow-y: auto;
    box-sizing: border-box;
  }
  .side-title { font-size: 16px; font-weight: 700; color: #57546E; margin-bottom: 10px; }
  .side-list { display: flex; flex-direction: column; gap: 8px; }
  .side-item {
    display: flex; align-items: center; gap: 8px;
    background: #F7F6FF; border: 2px solid #E3E0FF; border-radius: 14px;
    padding: 10px 12px; font-size: 15px; font-weight: 700;
  }
  .side-item .arrow { color: #9B98B8; font-size: 13px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .divider { width: 2px; align-self: stretch; background: #E3E0FF; border-radius: 2px; margin: 0 2px; }
  .controls label { font-size: 15px; color: #57546E; font-weight: 700; }
  .controls input[type=number] {
    width: 58px; height: 40px; text-align: center;
    border: 2px solid #2B2A3D; border-radius: 12px;
    font-size: 17px; font-weight: 700; font-family: inherit;
  }
  button {
    font-family: inherit; font-weight: 700; font-size: 15px;
    border: 2px solid #2B2A3D; background: #FFFFFF; color: #2B2A3D;
    border-radius: 14px; padding: 9px 14px; cursor: pointer;
    box-shadow: 3px 3px 0 #2B2A3D; transition: transform 0.08s ease;
  }
  button:hover { transform: translate(-1px,-1px); }
  button:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #2B2A3D; }
  button.primary { background: #FFE066; }
  button:disabled { opacity: 0.4; cursor: default; box-shadow: none; transform:none; }

  .scrollwrap { overflow-x: auto; padding: 0 0 16px; margin-top: 18px; margin-left: auto; margin-right: auto; }
  .inner { display: inline-block; }
  .row { display: flex; }
  .box {
    flex: 0 0 auto; display: flex; flex-direction: column;
    align-items: center; gap: 7px; padding: 10px 6px;
    background: #FBFAFF; border: 2.5px solid #E3E0FF; border-radius: 18px;
    box-sizing: border-box;
  }
  @keyframes shuffleJitter {
    0% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); }
  }
  .row.shuffle-anim { animation: shuffleJitter 0.5s ease; }
  .badge {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #FFFFFF; flex: 0 0 auto;
  }
  .box input[type=text] {
    width: 100%; height: 44px; text-align: center;
    border-width: 2.5px; border-style: solid; border-radius: 14px;
    font-size: 17px; font-weight: 700; padding: 0 6px; font-family: inherit;
  }
  .box input[type=text]:focus { outline: none; }
  .go-btn {
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
  }

  .logEmpty { font-size: 14px; color: #9B98B8; font-weight: 700; line-height: 1.6; }

  footer { text-align: center; color: #9E9BB5; font-size: 13px; margin-top: 8px; font-weight: 700; }
</style>
</head>
<body>
<span class="madeby">(Made in BuBie 1.2)</span>
<div class="page">
  <header>
    <h1>🪜 사다리타기</h1>
    <p>참가자를 누르면 아래로, 결과를 누르면 위로 타고 올라가요</p>
  </header>

  <div class="game-row">
    <div class="card">
      <div class="controls">
        <label for="countInput">참가자 수</label>
        <input type="number" id="countInput" min="2" max="16" value="4">
        <button id="applyBtn">인원 적용</button>
        <button id="startBtn" class="primary">🪜 사다리 시작</button>
        <span class="divider"></span>
        <button id="shuffleBtn">🔀 사다리 섞기</button>
        <button id="revealAllBtn">👀 전체 결과</button>
        <button id="resetBtn">↺ 초기화</button>
      </div>

      <div class="scrollwrap" id="scrollwrap">
        <div class="inner" id="inner">
          <div class="row" id="topRow"></div>
          <div id="svgWrap"></div>
          <div class="row" id="bottomRow"></div>
        </div>
      </div>
    </div>

    <div class="side-col">
      <div class="vol-bar">
        <button id="soundBtn">🔊</button>
        <input type="range" id="volSlider" min="0" max="100" value="70">
      </div>
      <div class="side-card">
        <div class="side-title">결과 보기</div>
        <div class="side-list" id="sideList"><span class="logEmpty">아직 확인한 결과가 없어요.<br>참가자나 결과를 눌러보세요.</span></div>
      </div>
    </div>
  </div>

  <footer>이 HTML 파일만 열면 인터넷 없이도 다른 컴퓨터에서 바로 실행돼요</footer>
</div>

<script>
(function(){
  var COLORS = ['#FF6B6B','#FFB84C','#F4C430','#6BCB77','#4D96FF','#9D7BFF','#FF6FB5','#4ECDC4','#F77F00','#B682FF','#3CB4AC','#E85D75','#5B8C5A','#C44536','#6C5B7B','#F2A65A'];
  var NEUTRAL = '#B8B4E0';
  var COL_W = 125;
  var state = { n:4, names:[], results:[], rungs:[], rows:9, dims:null, started:false, log:{}, forwardMap:[], inverseMap:[] };
  var soundOn = true;
  var volume = 0.7;
  var audioCtx = null;

  function ensureAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTick(){
    if (!soundOn || volume<=0) return;
    ensureAudio();
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22*volume, t0+0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.05);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+0.06);
  }

  function playFanfare(){
    if (!soundOn || volume<=0) return;
    ensureAudio();
    var t0 = audioCtx.currentTime;
    var run = [392.00, 523.25, 659.25, 783.99];
    run.forEach(function(freq, idx){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      var start = t0 + idx*0.09;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.26*volume, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start+0.22);
    });
    var chordStart = t0 + run.length*0.09 + 0.03;
    [783.99, 987.77, 1174.66].forEach(function(freq){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, chordStart);
      gain.gain.exponentialRampToValueAtTime(0.24*volume, chordStart+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, chordStart+0.55);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(chordStart); osc.stop(chordStart+0.6);
    });
  }

  function defaultNames(n, prefix){
    var arr = [];
    for (var i=0;i<n;i++) arr.push(prefix+(i+1));
    return arr;
  }

  function computeRows(n){
    if (n<=3) return 9;
    if (n<=5) return 11;
    if (n<=8) return 13;
    if (n<=12) return 16;
    return 18;
  }

  function randStyle(){ return { t1: 0.06+Math.random()*0.88, t2: 0.06+Math.random()*0.88 }; }

  function buildRungs(n, rows){
    var rungs = [];
    for (var r=0;r<rows;r++){
      var row = {};
      var c = 0;
      while (c < n-1){
        if (Math.random() < 0.42){
          row[c] = randStyle();
          c += 2;
        } else {
          c += 1;
        }
      }
      rungs.push(row);
    }
    ensureAllColumnsTouched(n, rows, rungs);
    ensureMinimumRungs(n, rows, rungs, 2);
    return rungs;
  }

  function countRungs(rungs){
    var c = 0;
    for (var r=0;r<rungs.length;r++) c += Object.keys(rungs[r]).length;
    return c;
  }

  function ensureMinimumRungs(n, rows, rungs, minCount){
    var attempts = 0;
    while (countRungs(rungs) < minCount && attempts < 200){
      attempts++;
      var r = Math.floor(Math.random()*rows);
      var c = Math.floor(Math.random()*(n-1));
      if (rungs[r][c-1] === undefined && rungs[r][c] === undefined && rungs[r][c+1] === undefined){
        rungs[r][c] = randStyle();
      }
    }
  }

  function ensureAllColumnsTouched(n, rows, rungs){
    for (var col=0; col<n; col++){
      var touched = false;
      for (var r=0;r<rows;r++){
        if (rungs[r][col] !== undefined) { touched = true; break; }
        if (col>0 && rungs[r][col-1] !== undefined) { touched = true; break; }
      }
      if (touched) continue;

      var order = [];
      for (var i=0;i<rows;i++) order.push(i);
      order.sort(function(){ return Math.random()-0.5; });

      var placed = false;
      for (var oi=0; oi<order.length && !placed; oi++){
        var r = order[oi];
        if (col+1 <= n-1 && rungs[r][col-1] === undefined && rungs[r][col] === undefined && rungs[r][col+1] === undefined){
          rungs[r][col] = randStyle();
          placed = true;
        } else if (col>=1){
          var k = col-1;
          if (rungs[r][k-1] === undefined && rungs[r][k] === undefined && rungs[r][k+1] === undefined){
            rungs[r][k] = randStyle();
            placed = true;
          }
        }
      }
      if (!placed){
        var fr = order[0];
        delete rungs[fr][col-1];
        delete rungs[fr][col];
        delete rungs[fr][col+1];
        if (col+1 <= n-1) rungs[fr][col] = randStyle();
        else rungs[fr][col-1] = randStyle();
      }
    }
  }

  function colX(i){ return COL_W*(i+0.5); }

  function tracePath(start, n, rungs, rows, topPad, rowH){
    var col = start;
    var x = colX(col);
    var y = topPad;
    var pts = [{x:x, y:y}];
    for (var r=0;r<rows;r++){
      var yTop = topPad + r*rowH;
      var yBottom = topPad + (r+1)*rowH;
      var newCol = col, yA = null, yB = null;
      if (rungs[r][col] !== undefined){
        var angleR = rungs[r][col];
        newCol = col+1;
        yA = yTop + angleR.t1*rowH;
        yB = yTop + angleR.t2*rowH;
      } else if (col>0 && rungs[r][col-1] !== undefined){
        var angleL = rungs[r][col-1];
        newCol = col-1;
        yA = yTop + angleL.t2*rowH;
        yB = yTop + angleL.t1*rowH;
      }
      if (newCol !== col){
        var x2 = colX(newCol);
        pts.push({x:x, y:yA});
        pts.push({x:x2, y:yB});
        pts.push({x:x2, y:yBottom});
        col = newCol; x = x2;
      } else {
        pts.push({x:x, y:yBottom});
      }
    }
    return { pts:pts, finalCol:col };
  }

  function ptsToD(pts){
    var d = 'M '+pts[0].x+' '+pts[0].y;
    for (var i=1;i<pts.length;i++) d += ' L '+pts[i].x+' '+pts[i].y;
    return d;
  }

  function computeMapping(){
    var n = state.n, dims = state.dims;
    var fwd = [], inv = [];
    for (var i=0;i<n;i++){
      var res = tracePath(i, n, state.rungs, state.rows, dims.topPad, dims.rowH);
      fwd[i] = res.finalCol;
      inv[res.finalCol] = i;
    }
    state.forwardMap = fwd;
    state.inverseMap = inv;
  }

  function init(n, keepNames){
    state.n = n;
    if (!keepNames || state.names.length !== n){
      state.names = defaultNames(n, '');
      state.results = new Array(n).fill('');
    }
    state.rows = computeRows(n);
    var topPad = 16, bottomPad = 16, rowH = 26;
    state.dims = { topPad:topPad, bottomPad:bottomPad, rowH:rowH, H: topPad+bottomPad+state.rows*rowH };
    state.rungs = buildRungs(n, state.rows);
    computeMapping();
    state.started = false;
    state.log = {};
    render();
  }

  function tint(hex, alpha){ return hex + alpha; }

  function render(){
    var n = state.n;
    document.getElementById('inner').style.width = (COL_W*n)+'px';
    var visibleCols = Math.min(n, 6);
    document.getElementById('scrollwrap').style.maxWidth = (visibleCols*COL_W)+'px';

    var topRow = document.getElementById('topRow');
    var bottomRow = document.getElementById('bottomRow');
    topRow.innerHTML = '';
    bottomRow.innerHTML = '';

    for (var i=0;i<n;i++){
      (function(i){
        var color = COLORS[i % COLORS.length];
        var col = document.createElement('div');
        col.className = 'box';
        col.style.width = COL_W+'px';
        var badge = document.createElement('div');
        badge.className = 'badge';
        badge.style.background = color;
        badge.textContent = (i+1);
        var input = document.createElement('input');
        input.type = 'text';
        input.value = state.names[i];
        input.style.borderColor = tint(color,'66');
        input.setAttribute('aria-label', '참가자 '+(i+1)+' 이름');
        input.oninput = function(){ state.names[i] = input.value; refreshLog(); };
        var goBtn = document.createElement('button');
        goBtn.className = 'go-btn';
        goBtn.id = 'go-'+i;
        goBtn.innerHTML = '▶';
        goBtn.title = '사다리 타고 내려가기';
        goBtn.disabled = true;
        goBtn.style.borderColor = color;
        goBtn.style.color = color;
        goBtn.style.opacity = '0.4';
        goBtn.onclick = function(){ if (state.started) playRoute(i, false); };
        col.appendChild(badge);
        col.appendChild(input);
        col.appendChild(goBtn);
        topRow.appendChild(col);
      })(i);
    }

    for (var j=0;j<n;j++){
      (function(j){
        var col = document.createElement('div');
        col.className = 'box';
        col.id = 'resWrap-'+j;
        col.style.width = COL_W+'px';
        var input = document.createElement('input');
        input.type = 'text';
        input.value = state.results[j];
        input.style.borderColor = '#E3E0FF';
        input.setAttribute('aria-label', '결과 '+(j+1));
        input.oninput = function(){ state.results[j] = input.value; refreshLog(); };
        var upBtn = document.createElement('button');
        upBtn.className = 'go-btn';
        upBtn.id = 'up-'+j;
        upBtn.innerHTML = '▲';
        upBtn.title = '역으로 참가자 찾기';
        upBtn.disabled = true;
        upBtn.style.opacity = '0.4';
        upBtn.onclick = function(){
          if (!state.started) return;
          var i = state.inverseMap[j];
          if (i !== undefined) playRoute(i, true);
        };
        col.appendChild(input);
        col.appendChild(upBtn);
        bottomRow.appendChild(col);
      })(j);
    }

    buildSvg();
    refreshLog();
  }

  function buildSvg(){
    var n = state.n, dims = state.dims, W = COL_W*n;
    var svgWrap = document.getElementById('svgWrap');
    var parts = [];
    parts.push('<svg width="'+W+'" height="'+dims.H+'" viewBox="0 0 '+W+' '+dims.H+'" style="display:block;">');
    parts.push('<defs><linearGradient id="rainbowGrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#FF3B30"/>'+
      '<stop offset="16%" stop-color="#FF9500"/>'+
      '<stop offset="33%" stop-color="#FFD60A"/>'+
      '<stop offset="50%" stop-color="#34C759"/>'+
      '<stop offset="66%" stop-color="#0A84FF"/>'+
      '<stop offset="83%" stop-color="#5E5CE6"/>'+
      '<stop offset="100%" stop-color="#FF2D95"/>'+
      '</linearGradient>'+
      '<filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">'+
      '<feGaussianBlur stdDeviation="2.4" result="blur"/>'+
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'+
      '</filter></defs>');
    parts.push('<g id="rungLayer">');
    for (var r=0;r<state.rows;r++){
      var yTop = dims.topPad + r*dims.rowH;
      for (var key in state.rungs[r]){
        var c = parseInt(key,10);
        var x1 = colX(c), x2 = colX(c+1);
        var angle = state.rungs[r][key];
        var y1 = yTop + angle.t1*dims.rowH;
        var y2 = yTop + angle.t2*dims.rowH;
        parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#B8B4E0" stroke-width="3" stroke-linecap="round"/>');
      }
    }
    parts.push('</g>');
    parts.push('<rect id="overlayRect" x="0" y="0" width="'+W+'" height="'+dims.H+'" fill="#FFFFFF"/>');
    parts.push('<g id="railsLayer">');
    for (var i=0;i<n;i++){
      var x = colX(i);
      parts.push('<line x1="'+x+'" y1="'+dims.topPad+'" x2="'+x+'" y2="'+(dims.H-dims.bottomPad)+'" stroke="#2B2A3D" stroke-width="3" stroke-linecap="round"/>');
      parts.push('<circle cx="'+x+'" cy="'+dims.topPad+'" r="5" fill="#FFFFFF" stroke="#2B2A3D" stroke-width="2.5"/>');
      parts.push('<circle cx="'+x+'" cy="'+(dims.H-dims.bottomPad)+'" r="5" fill="#FFFFFF" stroke="#2B2A3D" stroke-width="2.5"/>');
    }
    parts.push('</g>');
    parts.push('<g id="pathLayer"></g>');
    parts.push('</svg>');
    svgWrap.innerHTML = parts.join('');
    if (state.started){
      var r = document.getElementById('overlayRect');
      r.setAttribute('height', '0');
    }
  }

  function startLadder(){
    if (state.started) return;
    state.started = true;
    ensureAudio();
    var rect = document.getElementById('overlayRect');
    var H = state.dims.H;
    var duration = 700;
    var start = null;
    function frame(ts){
      if (!start) start = ts;
      var t = Math.min(1, (ts-start)/duration);
      rect.setAttribute('y', String(H*t));
      rect.setAttribute('height', String(H*(1-t)));
      if (t < 1) requestAnimationFrame(frame);
      else enablePlayButtons();
    }
    requestAnimationFrame(frame);
  }

  function enablePlayButtons(){
    for (var i=0;i<state.n;i++){
      var g = document.getElementById('go-'+i);
      if (g){ g.disabled = false; g.style.opacity = '1'; }
      var u = document.getElementById('up-'+i);
      if (u){ u.disabled = false; u.style.opacity = '1'; }
    }
  }

  var activeTimers = {};

  function playRoute(i, reverse, silent){
    var n = state.n, dims = state.dims;
    var result = tracePath(i, n, state.rungs, state.rows, dims.topPad, dims.rowH);
    var pathLayer = document.getElementById('pathLayer');
    var color = COLORS[i % COLORS.length];
    var usePts = reverse ? result.pts.slice().reverse() : result.pts;

    var existing = document.getElementById('route-'+i);
    if (existing) existing.parentNode.removeChild(existing);
    if (activeTimers[i]){
      activeTimers[i].forEach(function(id){ clearTimeout(id); });
    }
    activeTimers[i] = [];

    var svgns = 'http://www.w3.org/2000/svg';
    var pathEl = document.createElementNS(svgns, 'path');
    pathEl.id = 'route-'+i;
    pathEl.setAttribute('d', ptsToD(usePts));
    pathEl.setAttribute('fill', 'none');
    pathEl.setAttribute('stroke', 'url(#rainbowGrad)');
    pathEl.setAttribute('filter', 'url(#lineGlow)');
    pathEl.setAttribute('stroke-width', '5');
    pathEl.setAttribute('stroke-linecap', 'round');
    pathEl.setAttribute('stroke-linejoin', 'round');
    pathLayer.appendChild(pathEl);
    var len = pathEl.getTotalLength();
    pathEl.setAttribute('stroke-dasharray', len);
    pathEl.setAttribute('stroke-dashoffset', len);

    var duration = 900 + state.rows*260;

    if (!silent){
      for (var k=1; k<=state.rows; k++){
        var when = (k/state.rows)*duration;
        var tid = setTimeout(playTick, when);
        activeTimers[i].push(tid);
      }
    }

    var start = null;

    function frame(ts){
      if (!start) start = ts;
      var t = Math.min(1, (ts-start)/duration);
      pathEl.setAttribute('stroke-dashoffset', String(len*(1-t)));
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        pathEl.setAttribute('stroke', color);
        highlight(i, result.finalCol, color);
        state.log[i] = result.finalCol;
        refreshLog();
        if (!silent) playFanfare();
      }
    }
    requestAnimationFrame(frame);
    return duration;
  }

  function highlight(i, j, color){
    var tops = document.querySelectorAll('#topRow > div');
    if (tops[i]) tops[i].style.background = tint(color,'22');
    var res = document.getElementById('resWrap-'+j);
    if (res) res.style.background = tint(color,'22');
  }

  function revealAll(){
    if (!state.started) startLadder();
    var n = state.n;
    var stagger = 70;
    var duration = 900 + state.rows*260;
    for (var i=0;i<n;i++){
      (function(i){ setTimeout(function(){ playRoute(i, false, true); }, i*stagger); })(i);
    }
    playTick();
    setTimeout(playFanfare, (n-1)*stagger + duration);
  }

  function refreshLog(){
    var list = document.getElementById('sideList');
    var keys = Object.keys(state.log).map(Number).sort(function(a,b){ return a-b; });
    if (keys.length === 0){
      list.innerHTML = '<span class="logEmpty">아직 확인한 결과가 없어요.<br>참가자나 결과를 눌러보세요.</span>';
      return;
    }
    var html = '';
    keys.forEach(function(i){
      var j = state.log[i];
      var color = COLORS[i % COLORS.length];
      var nameLabel = (state.names[i] && state.names[i].trim()) ? state.names[i] : (i+1);
      var resLabel = (state.results[j] && state.results[j].trim()) ? state.results[j] : ('결과'+(j+1));
      html += '<div class="side-item"><span class="logDot" style="width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:'+color+'"></span>'+nameLabel+'<span class="arrow">→</span>'+resLabel+'</div>';
    });
    list.innerHTML = html;
  }

  function resetAll(){
    init(state.n, false);
  }

  document.getElementById('applyBtn').onclick = function(){
    var v = parseInt(document.getElementById('countInput').value, 10);
    if (isNaN(v)) v = 4;
    v = Math.max(2, Math.min(16, v));
    document.getElementById('countInput').value = v;
    init(v, false);
  };
  function shuffleArray(arr){
    for (var i=arr.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
  }

  document.getElementById('shuffleBtn').onclick = function(){
    var topRow = document.getElementById('topRow');
    var bottomRow = document.getElementById('bottomRow');
    topRow.classList.add('shuffle-anim');
    bottomRow.classList.add('shuffle-anim');
    setTimeout(function(){
      shuffleArray(state.names);
      shuffleArray(state.results);
      state.rungs = buildRungs(state.n, state.rows);
      computeMapping();
      state.started = false;
      state.log = {};
      render();
      var tr = document.getElementById('topRow');
      var br = document.getElementById('bottomRow');
      tr.classList.add('shuffle-anim');
      br.classList.add('shuffle-anim');
      setTimeout(function(){
        tr.classList.remove('shuffle-anim');
        br.classList.remove('shuffle-anim');
      }, 500);
    }, 220);
  };
  document.getElementById('startBtn').onclick = startLadder;
  document.getElementById('revealAllBtn').onclick = revealAll;
  document.getElementById('resetBtn').onclick = resetAll;
  document.getElementById('soundBtn').onclick = function(){
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  };
  document.getElementById('volSlider').oninput = function(e){
    volume = e.target.value/100;
  };

  init(4, false);
})();
</script>
</body>
</html>
