<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도전! 추억의뽑기!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<style>
  :root{
    --sky-top:#bdeaff;
    --sky-bottom:#eaf9ff;
    --grass:#dff2c8;
    --grass-dark:#cdeab0;
    --tree:#8fce6a;
    --tree-dark:#6fb84d;
    --card-yellow:#ffe94d;
    --card-red:#ff5555;
    --card-green:#3ecf6e;
    --ink:#2b2b2b;
    --blue-title:#1560e8;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--grass) 55%, var(--grass-dark) 100%);
    min-height:100vh;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
    color:var(--ink);
    position:relative;
  }

  /* ---------- 배경 장식 (구름 + 나무, 순수 CSS) ---------- */
  .cloud{ position:absolute; background:#fff; border-radius:50px; opacity:.9; }
  .cloud::before, .cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
  .tree{ position:absolute; bottom:44vh; width:90px; height:110px; }
  .tree .leaf{ position:absolute; background:var(--tree); border-radius:50%; }
  .tree .leaf.dark{ background:var(--tree-dark); }
  .tree .trunk{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:16px; height:34px; background:#c9a06a; border-radius:3px; }

  /* ---------- 상단 헤더 ---------- */
  header{
    position:relative; z-index:5;
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 26px; flex-wrap:wrap; gap:14px;
  }
  .title{
    font-size:28px; font-weight:800; color:var(--blue-title);
  }
  .header-right{ display:flex; align-items:center; gap:16px; }
  .volume-box{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.7); border:2px solid #333; border-radius:10px;
    padding:8px 14px;
  }
  .volume-box svg{ width:20px; height:20px; flex-shrink:0; }
  .volume-box input[type=range]{ width:110px; accent-color:var(--blue-title); }
  .volume-box .volume-value{ font-size:13px; font-weight:700; min-width:32px; text-align:right; }

  .signature{
    position:fixed; right:10px; bottom:6px; font-size:12px; color:#5a6b57;
    opacity:.75; z-index:5; letter-spacing:.2px;
  }

  /* ---------- 화면 전환 ---------- */
  .screen{ display:none; position:relative; z-index:5; }
  .screen.active{ display:block; }

  /* ---------- 설정 화면 ---------- */
  #screen-setup{ text-align:center; padding-top:190px; }
  #screen-setup h2{ font-size:30px; margin-bottom:56px; color:#333; }
  .setup-row{
    display:flex; justify-content:center; align-items:center; gap:60px; flex-wrap:wrap;
    margin-bottom:60px;
  }
  .setup-field{ display:flex; align-items:center; gap:16px; }
  .setup-field label{ font-size:30px; font-weight:800; }
  .setup-field input{
    width:150px; font-size:22px; padding:14px 16px; border:1px solid #999;
    border-radius:6px; background:#fff; text-align:left;
  }

  /* ---------- 당첨 상품 설정 ---------- */
  .prize-config{
    max-width:520px; margin:0 auto 36px; text-align:left;
    background:rgba(255,255,255,.65); border:2px solid #333; border-radius:12px;
    padding:18px 22px;
  }
  .prize-config h3{ margin:0 0 12px; font-size:17px; }
  .prize-config .hint{ font-size:12px; font-weight:400; color:#666; }
  #prize-rows{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .prize-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .prize-row span{ font-size:13px; font-weight:700; color:#444; }
  .prize-row input[type=text]{
    flex:1; min-width:100px; font-size:14px; padding:7px 10px; border:1px solid #999;
    border-radius:6px;
  }
  .prize-row input[type=number]{
    width:64px; font-size:14px; padding:7px 8px; border:1px solid #999; border-radius:6px;
    text-align:center;
  }
  .prize-row .btn-remove-row{
    width:28px; height:28px; border-radius:6px; border:1px solid #999; background:#fff;
    cursor:pointer; font-size:14px; color:#a33; flex-shrink:0;
  }
  #btn-add-prize{
    font-size:14px; font-weight:700; padding:8px 16px; border-radius:8px; border:2px dashed #666;
    background:#fff; cursor:pointer;
  }
  .prize-total{ margin:10px 0 0; font-size:13px; font-weight:700; color:var(--blue-title); }

  #btn-start{
    font-size:26px; font-weight:800; padding:16px 60px; border-radius:10px;
    border:3px solid #333; cursor:pointer;
    background:linear-gradient(180deg,#fdfdfd,#dcdcdc);
    box-shadow:0 4px 0 #999;
  }
  #btn-start:active{ transform:translateY(2px); box-shadow:0 2px 0 #999; }

  .error-msg{ color:#d1372b; font-weight:700; margin-top:-40px; margin-bottom:30px; min-height:24px; }

  /* ---------- 게임 화면 ---------- */
  #screen-game{ padding:24px 30px 100px; }
  .board{
    display:grid; gap:0; margin:0 auto;
    width:min(90vw, 78vh);
    border-left:3px solid #333; border-top:3px solid #333;
  }
  .cell{
    position:relative;
    border-right:3px solid #333; border-bottom:3px solid #333;
    background:var(--card-yellow);
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(18px, 3vw, 46px); font-weight:800;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  .cell .pin{
    position:absolute; top:6px; left:50%; transform:translateX(-50%);
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #888, #333);
  }
  .cell:hover:not(.revealed){ filter:brightness(1.06); }
  .cell.revealed{ cursor:default; }
  .cell.win{ background:var(--card-green); color:#0a3d1c; animation:pop .35s ease; }
  .cell.lose{ background:var(--card-red); color:#5c0000; animation:pop .35s ease; }
  .cell .label{
    line-height:1.15; padding:0 4px; text-align:center;
    word-break:keep-all; overflow-wrap:break-word;
  }
  .cell .label.long-text{ font-size:.62em; }
  @keyframes pop{
    0%{ transform:scale(.85); }
    60%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  .game-topbar{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;
    flex-wrap:wrap; gap:12px;
  }
  .game-topbar .left-info{ font-size:18px; font-weight:700; color:#333; }
  #btn-home{
    font-size:15px; font-weight:700; padding:8px 16px; border-radius:8px; border:2px solid #333;
    background:#fff; cursor:pointer;
  }
  #btn-reveal-all{
    font-size:15px; font-weight:700; padding:8px 16px; border-radius:8px; border:2px solid #333;
    background:#fff8dd; cursor:pointer;
  }
  .random-open-box{
    display:flex; align-items:center; gap:6px;
    background:#eaf6ff; border:2px solid #333; border-radius:8px; padding:6px 10px;
  }
  .random-open-box span{ font-size:14px; font-weight:700; white-space:nowrap; }
  .random-open-box input{
    width:52px; font-size:15px; padding:5px 6px; border:1px solid #999; border-radius:6px; text-align:center;
  }
  .random-open-box button{
    font-size:14px; font-weight:700; padding:7px 12px; border-radius:6px; border:2px solid #333;
    background:#fff; cursor:pointer; white-space:nowrap;
  }
  .topbar-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

  #btn-retry{
    position:fixed; right:30px; bottom:30px; z-index:10;
    font-size:20px; font-weight:800; padding:12px 30px; border-radius:8px;
    border:3px solid #333; cursor:pointer;
    background:linear-gradient(180deg,#fdfdfd,#dcdcdc);
    box-shadow:0 4px 0 #999;
  }
  #btn-retry:active{ transform:translateY(2px); box-shadow:0 2px 0 #999; }

  /* ---------- 당첨 로그 (작고 눈에 거슬리지 않게) ---------- */
  .win-log{
    position:fixed; left:20px; bottom:20px; z-index:10;
    width:190px; max-height:170px;
    background:rgba(255,255,255,.72); border:1px solid #999; border-radius:10px;
    padding:8px 10px; backdrop-filter:blur(2px);
    display:flex; flex-direction:column;
  }
  .win-log-title{ font-size:12px; font-weight:800; color:#444; margin-bottom:4px; }
  .win-log-list{ overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .win-log-empty{ margin:0; font-size:11px; color:#999; }
  .win-log-entry{
    font-size:12px; color:#333; padding:2px 0; border-bottom:1px dashed #ddd;
    display:flex; justify-content:space-between; gap:6px;
  }
  .win-log-entry:last-child{ border-bottom:none; }
  .win-log-entry .num{ font-weight:700; color:var(--blue-title); flex-shrink:0; }
  .win-log-entry .prize{ text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#1a7a3d; font-weight:700; }
  .win-log-entry.lose-entry .num{ color:#888; }
  .win-log-entry.lose-entry .prize{ color:#a33; font-weight:500; }

  /* 완료 배너 */
  .done-banner{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.8);
    background:#fff; border:4px solid var(--blue-title); border-radius:16px;
    padding:36px 54px; text-align:center; font-size:24px; font-weight:800;
    box-shadow:0 12px 40px rgba(0,0,0,.25); opacity:0; pointer-events:none;
    transition:.25s ease; z-index:20;
  }
  .done-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  .done-banner .sub{ font-size:16px; font-weight:500; color:#555; margin-top:10px; }
  .done-banner .btn-row{ display:flex; gap:12px; justify-content:center; margin-top:20px; }
  .done-banner button{
    font-size:17px; font-weight:700; padding:10px 26px;
    border-radius:8px; border:2px solid #333; cursor:pointer; background:#f5f5f5;
  }
  .done-banner button.primary{ background:var(--blue-title); color:#fff; border-color:var(--blue-title); }

  @media (max-width:640px){
    .title{ font-size:20px; }
    #screen-setup h2{ font-size:20px; }
    .setup-field label{ font-size:20px; }
    .setup-field input{ width:100px; font-size:18px; }
    .volume-box input[type=range]{ width:70px; }
  }
</style>
</head>
<body>

  <!-- 배경 장식 -->
  <div class="cloud" style="width:110px;height:36px;top:60px;left:5%;"></div>
  <div class="cloud" style="width:150px;height:44px;top:40px;left:60%;"></div>
  <div class="cloud" style="width:90px;height:30px;top:110px;left:85%;"></div>

  <div class="tree" style="left:8%;">
    <div class="leaf dark" style="width:70px;height:70px;left:10px;top:10px;"></div>
    <div class="leaf" style="width:60px;height:60px;left:20px;top:0;"></div>
    <div class="trunk"></div>
  </div>
  <div class="tree" style="left:70%;">
    <div class="leaf dark" style="width:80px;height:80px;left:5px;top:5px;"></div>
    <div class="leaf" style="width:65px;height:65px;left:18px;top:-5px;"></div>
    <div class="trunk"></div>
  </div>
  <div class="tree" style="left:85%;">
    <div class="leaf dark" style="width:60px;height:60px;left:12px;top:15px;"></div>
    <div class="leaf" style="width:50px;height:50px;left:22px;top:5px;"></div>
    <div class="trunk"></div>
  </div>

  <header>
    <div class="title" id="title-text">추억의 뽑기 New</div>
    <div class="header-right">
      <div class="volume-box" title="효과음 볼륨">
        <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M17 8a5 5 0 0 1 0 8" stroke-linecap="round"/>
        </svg>
        <input type="range" id="input-volume" min="0" max="100" value="70">
        <span class="volume-value" id="volume-value">70%</span>
      </div>
    </div>
  </header>

  <div class="signature">(Made in BuBie 1.1)</div>

  <!-- ============================================================
       설정 화면
       ============================================================ -->
  <section id="screen-setup" class="screen active">
    <div class="setup-row">
      <div class="setup-field">
        <label for="input-total">뽑기개수</label>
        <input type="number" id="input-total" min="1" max="200" value="30">
      </div>
      <div class="setup-field">
        <label for="input-win">당첨인원</label>
        <input type="number" id="input-win" min="1" max="200" value="1">
      </div>
    </div>

    <div class="prize-config">
      <h3>🎁 당첨 상품 설정 <span class="hint">(선택사항 - 비워두면 그냥 "당첨"으로 표시)</span></h3>
      <div id="prize-rows"></div>
      <button type="button" id="btn-add-prize">+ 상품 추가</button>
      <p class="prize-total" id="prize-total-text" style="display:none;"></p>
    </div>

    <p class="error-msg" id="error-msg"></p>

    <button id="btn-start">시 작</button>
  </section>

  <!-- ============================================================
       게임 화면
       ============================================================ -->
  <section id="screen-game" class="screen">
    <div class="game-topbar">
      <button id="btn-home">← 처음으로</button>
      <div class="topbar-right">
        <div class="left-info" id="progress-text">0 / 0 공개</div>
        <div class="random-open-box">
          <span>한번에</span>
          <input type="number" id="input-randomCount" min="1" value="3">
          <span>개 랜덤 열기</span>
          <button id="btn-random-open">🎲 열기</button>
        </div>
        <button id="btn-reveal-all">🎬 한번에 열기</button>
      </div>
    </div>
    <div class="board" id="board"></div>

    <div class="win-log" id="win-log">
      <div class="win-log-title">🏆 당첨 로그</div>
      <div class="win-log-list" id="win-log-list">
        <p class="win-log-empty" id="win-log-empty">아직 당첨 없음</p>
      </div>
    </div>

    <button id="btn-retry">다시하기</button>
  </section>

  <div class="done-banner" id="done-banner">
    🎉 모두 공개되었습니다!
    <div class="sub" id="done-sub"></div>
    <div class="btn-row">
      <button id="btn-done-retry" class="primary">다시하기</button>
      <button id="btn-done-home">처음으로</button>
    </div>
  </div>

<script>
/* ============================================================
   간단 뽑기판 - script
   ============================================================ */
const $ = s => document.querySelector(s);

let state = {
  total: 30,
  win: 10,
  cells: [],      // {num, isWin, revealed, prize}
  revealedCount: 0,
  volume: 70,     // 0~100
  prizeLabels: [], // 최근 사용한 상품 라벨 배열 (다시하기 시 재사용)
};

let prizeRows = []; // 설정 화면에서 편집 중인 상품 목록: {name, count}

function init(){
  $('#btn-start').addEventListener('click', startGame);
  $('#btn-retry').addEventListener('click', () => buildAndRenderGame(state.total, state.win, state.prizeLabels));
  $('#btn-done-retry').addEventListener('click', () => {
    hideBanner();
    buildAndRenderGame(state.total, state.win, state.prizeLabels);
  });
  $('#btn-done-home').addEventListener('click', () => {
    goHome();
  });
  $('#btn-home').addEventListener('click', goHome);
  $('#btn-reveal-all').addEventListener('click', revealAllCells);
  $('#btn-random-open').addEventListener('click', () => {
    const n = clampInt($('#input-randomCount').value, 1, 999);
    revealRandomCells(n);
  });
  $('#btn-add-prize').addEventListener('click', () => {
    prizeRows.push({ name: '', count: 1 });
    renderPrizeRows();
  });
  $('#input-win').addEventListener('input', () => {
    // 상품이 하나도 설정되지 않았을 때만 수동 입력 허용
    if (prizeRows.length === 0) return;
  });
  $('#input-volume').addEventListener('input', e => {
    state.volume = +e.target.value;
    $('#volume-value').textContent = state.volume + '%';
  });
  document.addEventListener('dragstart', e => e.preventDefault());
}

/* ============================================================
   효과음 (Web Audio 합성 - 외부 파일 불필요)
   ============================================================ */
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 카드를 클릭하는 순간 나는 짧은 "톡" 소리
function playClickSound(){
  if (state.volume <= 0) return;
  try{
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const vol = state.volume / 100;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(700, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
    gain.gain.setValueAtTime(vol * 0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }catch(e){ /* 오디오 미지원 환경 무시 */ }
}

// 당첨 - 밝고 경쾌한 상승 아르페지오
function playWinSound(){
  if (state.volume <= 0) return;
  try{
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const vol = state.volume / 100;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t0 = now + i * 0.09;
      gain.gain.setValueAtTime(vol * 0.32, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.36);
    });
  }catch(e){ /* 오디오 미지원 환경 무시 */ }
}

// 꽝 - 낮고 짧은 부저음
function playLoseSound(){
  if (state.volume <= 0) return;
  try{
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const vol = state.volume / 100;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(85, now + 0.3);
    gain.gain.setValueAtTime(vol * 0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.33);
  }catch(e){ /* 오디오 미지원 환경 무시 */ }
}

/* ============================================================
   당첨 상품 설정 (설정 화면)
   ============================================================ */
function renderPrizeRows(){
  const wrap = $('#prize-rows');
  wrap.innerHTML = '';
  prizeRows.forEach((row, idx) => {
    const div = document.createElement('div');
    div.className = 'prize-row';
    div.innerHTML = `
      <span>당첨</span>
      <input type="text" class="prize-name" data-idx="${idx}" maxlength="14" placeholder="상품명 (예: 치킨)" value="${escapeAttr(row.name)}">
      <span>인원</span>
      <input type="number" class="prize-count" data-idx="${idx}" min="1" max="200" value="${row.count}">
      <button type="button" class="btn-remove-row" data-idx="${idx}">✕</button>
    `;
    wrap.appendChild(div);
  });

  wrap.querySelectorAll('.prize-name').forEach(inp => {
    inp.addEventListener('input', () => {
      prizeRows[+inp.dataset.idx].name = inp.value;
      updatePrizeTotal();
    });
  });
  wrap.querySelectorAll('.prize-count').forEach(inp => {
    inp.addEventListener('input', () => {
      prizeRows[+inp.dataset.idx].count = clampInt(inp.value, 1, 200);
      updatePrizeTotal();
    });
  });
  wrap.querySelectorAll('.btn-remove-row').forEach(btn => {
    btn.addEventListener('click', () => {
      prizeRows.splice(+btn.dataset.idx, 1);
      renderPrizeRows();
    });
  });

  updatePrizeTotal();
}

function updatePrizeTotal(){
  const winInput = $('#input-win');
  const totalText = $('#prize-total-text');
  if (prizeRows.length === 0){
    winInput.disabled = false;
    winInput.style.background = '#fff';
    totalText.style.display = 'none';
    return;
  }
  const sum = prizeRows.reduce((s, r) => s + (r.count || 0), 0);
  winInput.value = sum;
  winInput.disabled = true;
  winInput.style.background = '#eee';
  totalText.style.display = 'block';
  totalText.textContent = `상품 설정 합계로 당첨인원이 자동 계산됩니다: 총 ${sum}명`;
}

function escapeAttr(str){
  return String(str || '').replace(/[&<>"']/g, s => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[s]));
}

function startGame(){
  const total = clampInt($('#input-total').value, 1, 200);
  const win = clampInt($('#input-win').value, 1, 200);

  if (win > total){
    $('#error-msg').textContent = '당첨인원은 뽑기개수보다 많을 수 없습니다.';
    return;
  }
  $('#error-msg').textContent = '';

  // 상품 설정에 따라 당첨 칸마다 표시될 라벨 배열 생성
  let labels;
  if (prizeRows.length > 0){
    labels = [];
    prizeRows.forEach(row => {
      const name = row.name.trim();
      for (let i = 0; i < row.count; i++) labels.push(name || null);
    });
  } else {
    labels = Array.from({ length: win }, () => null);
  }

  buildAndRenderGame(total, win, labels);
}

function clampInt(v, min, max){
  v = parseInt(v, 10);
  if (isNaN(v)) v = min;
  return Math.min(max, Math.max(min, v));
}

function buildAndRenderGame(total, win, labels){
  state.total = total;
  state.win = win;
  state.revealedCount = 0;
  state.prizeLabels = labels || Array.from({ length: win }, () => null);

  const winIdx = [...Array(total).keys()];
  shuffle(winIdx);
  const winSet = new Set(winIdx.slice(0, win));

  // 상품 라벨을 당첨 칸에 랜덤 배정 (라벨 개수가 win과 다르면 부족분은 null로 채움)
  const shuffledLabels = state.prizeLabels.slice(0, win);
  while (shuffledLabels.length < win) shuffledLabels.push(null);
  shuffle(shuffledLabels);

  let labelPtr = 0;
  state.cells = Array.from({length: total}, (_, i) => {
    const isWin = winSet.has(i);
    return {
      num: i + 1,
      isWin,
      revealed: false,
      prize: isWin ? shuffledLabels[labelPtr++] : null,
    };
  });

  hideBanner();
  showScreen('game');
  renderBoard();
  updateProgress();
  clearWinLog();
}

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function renderBoard(){
  const board = $('#board');
  board.innerHTML = '';
  const n = state.total;
  const cols = Math.ceil(Math.sqrt(n));
  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  state.cells.forEach((cell, idx) => {
    const div = document.createElement('div');
    div.className = 'cell';
    div.dataset.idx = idx;
    div.innerHTML = `<span class="pin"></span><span class="label">${cell.num}</span>`;
    div.addEventListener('click', () => revealCell(idx));
    board.appendChild(div);
  });
}

function revealCell(idx){
  const cell = state.cells[idx];
  if (cell.revealed) return;
  cell.revealed = true;
  state.revealedCount++;

  playClickSound();

  const el = document.querySelector(`.cell[data-idx="${idx}"]`);
  el.classList.add('revealed');

  if (cell.isWin){
    el.classList.add('win');
    const labelEl = el.querySelector('.label');
    const text = cell.prize ? `${cell.prize} 당첨` : '당첨';
    labelEl.textContent = text;
    labelEl.classList.toggle('long-text', text.length > 5);
    setTimeout(playWinSound, 90);
    addLogEntry(cell.num, 'win', cell.prize);
  } else {
    el.classList.add('lose');
    el.querySelector('.label').textContent = '꽝';
    setTimeout(playLoseSound, 90);
    addLogEntry(cell.num, 'lose');
  }

  updateProgress();

  if (state.revealedCount === state.total){
    setTimeout(showDoneBanner, 400);
  }
}

function updateProgress(){
  $('#progress-text').textContent = `${state.revealedCount} / ${state.total} 공개`;
}

/* ---------- 당첨 로그 ---------- */
function clearWinLog(){
  $('#win-log-list').innerHTML = '<p class="win-log-empty" id="win-log-empty">아직 당첨 없음</p>';
}
function addLogEntry(num, type, prize){
  const list = $('#win-log-list');
  const empty = $('#win-log-empty');
  if (empty) empty.remove();

  const entry = document.createElement('div');
  entry.className = 'win-log-entry' + (type === 'lose' ? ' lose-entry' : '');
  const text = type === 'win' ? (prize ? escapeAttr(prize) + ' 당첨' : '당첨') : '꽝';
  entry.innerHTML = `
    <span class="num">${num}번</span>
    <span class="prize">${text}</span>
  `;
  list.prepend(entry); // 최신 항목이 위로
}

// 남은 카드를 순차적으로 빠르게 모두 공개
function revealAllCells(){
  const remaining = state.cells
    .map((c, idx) => idx)
    .filter(idx => !state.cells[idx].revealed);
  revealSequence(remaining, 90);
}

// 남은 카드 중 n개를 랜덤으로 골라 공개
function revealRandomCells(n){
  const remaining = state.cells
    .map((c, idx) => idx)
    .filter(idx => !state.cells[idx].revealed);
  if (remaining.length === 0) return;

  shuffle(remaining);
  const picked = remaining.slice(0, Math.min(n, remaining.length));
  revealSequence(picked, 120);
}

// 주어진 인덱스 목록을 순서대로 딜레이를 두고 공개
function revealSequence(indices, delay){
  if (indices.length === 0) return;
  const buttons = [$('#btn-reveal-all'), $('#btn-random-open')];
  buttons.forEach(b => { b.disabled = true; b.style.opacity = '.5'; });

  let i = 0;
  function step(){
    if (i >= indices.length){
      buttons.forEach(b => { b.disabled = false; b.style.opacity = ''; });
      return;
    }
    revealCell(indices[i]);
    i++;
    setTimeout(step, delay);
  }
  step();
}

function showDoneBanner(){
  $('#done-sub').textContent = `뽑기개수 ${state.total}개 중 당첨 ${state.win}개가 모두 공개되었습니다.`;
  $('#done-banner').classList.add('show');
}
function hideBanner(){
  $('#done-banner').classList.remove('show');
}

function showScreen(name){
  $('#screen-setup').classList.toggle('active', name === 'setup');
  $('#screen-game').classList.toggle('active', name === 'game');
}
function goHome(){
  hideBanner();
  showScreen('setup');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
